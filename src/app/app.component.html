<div class="app-shell">
  <header class="app-header">
    <button class="hamburger-btn" (click)="toggleMenu()" [class.active]="menuOpen">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    @if (pageTitle) {
      <h1 class="header-title">{{ pageTitle }}</h1>
    }
  </header>

  @if (menuOpen) {
    <div class="menu-overlay" (click)="closeMenu()"></div>
    <nav class="slide-menu">
      <div class="menu-top">
        <a routerLink="/" class="menu-item" (click)="closeMenu()">Home</a>
        <a routerLink="/credits" class="menu-item" (click)="closeMenu()">Credits</a>
      </div>
      <div class="menu-bottom">
        <a routerLink="/settings" class="menu-item" (click)="closeMenu()">Settings</a>
        <button class="menu-item menu-item-danger" (click)="resetTournament()">Reset Tournament</button>
      </div>
    </nav>
  }

  <main class="app-content">
    <router-outlet />
  </main>
</div>

<app-confirm-dialog />
<app-add-team-dialog />
