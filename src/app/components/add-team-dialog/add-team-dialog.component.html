@if (isOpen) {
  <div class="dialog-overlay" (click)="onOverlayClick($event)">
    <div class="dialog-box">
      <h2 class="dialog-title">Add Team</h2>
      <div class="dialog-content">
        <label class="field-label" for="add-team-name-input">Team name</label>
        <input
          id="add-team-name-input"
          class="input"
          type="text"
          [(ngModel)]="teamName"
          (keydown)="onKeydown($event)"
          placeholder="e.g. Team Alpha"
        />
      </div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button class="btn btn-primary" (click)="onAdd()" [disabled]="!teamName.trim()">Add</button>
      </div>
    </div>
  </div>
}
