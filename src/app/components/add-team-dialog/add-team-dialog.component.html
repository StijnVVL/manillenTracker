@if (isOpen) {
  <div class="dialog-overlay" (click)="onOverlayClick($event)">
    <div class="dialog-box">
      <h2 class="dialog-title">{{ titleKey | l10n }}</h2>
      <div class="dialog-content">
        <div class="form-group">
          <label class="field-label" for="team-name-input">{{ 'dialog.addTeam.teamNameLabel' | l10n }}</label>
          <input
            id="team-name-input"
            class="input"
            type="text"
            [(ngModel)]="teamName"
            (keydown)="onKeydown($event)"
            [placeholder]="l10n.get('dialog.addTeam.placeholder')"
          />
        </div>
        <div class="form-group">
          <label class="field-label" for="player1-input">{{ 'dialog.addTeam.player1Label' | l10n }}</label>
          <input
            id="player1-input"
            class="input"
            type="text"
            [(ngModel)]="player1"
            (keydown)="onKeydown($event)"
            [placeholder]="l10n.get('dialog.addTeam.playerPlaceholder')"
          />
        </div>
        <div class="form-group">
          <label class="field-label" for="player2-input">{{ 'dialog.addTeam.player2Label' | l10n }}</label>
          <input
            id="player2-input"
            class="input"
            type="text"
            [(ngModel)]="player2"
            (keydown)="onKeydown($event)"
            [placeholder]="l10n.get('dialog.addTeam.playerPlaceholder')"
          />
        </div>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" (click)="onCancel()">{{ 'common.cancel' | l10n }}</button>
        <button class="btn btn-primary" (click)="onSubmit()" [disabled]="!isValid">{{ submitButtonKey | l10n }}</button>
      </div>
    </div>
  </div>
}
