<div class="setup-container">
  <p class="setup-description">
    {{ 'setup.description' | l10n }}
  </p>

  <div class="setup-summary">
    <p class="team-count">{{ 'setup.teamCount' | l10n:{ count: state.teams.length } }}</p>
    <a routerLink="/teams" class="btn btn-secondary">
      {{ 'setup.manageTeams' | l10n }}
    </a>
  </div>

  <div class="setup-actions">
    <button
      type="button"
      class="btn btn-primary"
      [disabled]="state.teams.length < 2"
      (click)="startTournament()"
    >
      {{ 'setup.startTournament' | l10n }}
    </button>
  </div>
</div>
