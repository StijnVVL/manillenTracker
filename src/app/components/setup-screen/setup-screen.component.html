<div class="setup-container">
  <p class="setup-description">
    Add teams, then start the tournament. The tournament
    runs for 5 rounds. Round 1 pairings are randomized.
  </p>

  <div class="setup-actions-top">
    <button type="button" class="btn btn-secondary" (click)="openAddTeamDialog()">
      Add Team
    </button>
  </div>

  @if (state.teams.length > 0) {
    <div class="teams-grid">
      @for (team of state.teams; track team.id) {
        <div class="team-item">
          <input
            class="input team-input"
            [ngModel]="editableNames[team.id]"
            (ngModelChange)="updateTeamName(team.id, $event)"
          />
          <button
            type="button"
            class="btn-icon btn-icon-danger"
            (click)="removeTeam(team.id)"
            title="Remove team"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
        </div>
      }
    </div>
  }

  <div class="setup-actions">
    <button
      type="button"
      class="btn btn-primary"
      [disabled]="state.teams.length < 2"
      (click)="startTournament()"
    >
      Start Tournament
    </button>
  </div>
</div>
