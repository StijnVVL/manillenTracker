<section class="timer-section">
  <div class="countdown-round">
    <span class="round-label">{{ 'header.roundLabel' | l10n }}</span>
    <span class="round-number">{{ roundNumber }}</span>
  </div>
  <div class="countdown" [style.color]="timerColor">
    @if (timeSegments.length > 0) {
      @for (seg of timeSegments; track $index) {
        @if (!$first) {<span class="countdown-colon" [style.opacity]="colonOpacity">:</span>}<span class="countdown-segment">{{ seg }}</span>
      }
    } @else {
      {{ formattedTime }}
    }
  </div>
</section>
