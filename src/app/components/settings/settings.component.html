<div class="settings-container">
  <div class="card">
    <h2 class="card-title">{{ 'settings.languageSettings' | l10n }}</h2>
    <app-language-selector />
  </div>

  <div class="card">
    <h2 class="card-title">{{ 'settings.roundSettings' | l10n }}</h2>

    <label class="field-label" for="round-duration">
      {{ 'settings.roundDurationLabel' | l10n }}
    </label>
    <input
      id="round-duration"
      class="input-number"
      type="number"
      min="1"
      max="240"
      [ngModel]="state.roundDurationMinutes"
      (ngModelChange)="onDurationChange($event)"
    />
    <p class="field-hint">
      {{ 'settings.roundDurationHint' | l10n }}
    </p>
  </div>
</div>
