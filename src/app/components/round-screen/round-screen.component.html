@if (currentRound) {
  <app-countdown-timer
    [remainingSeconds]="remainingSeconds"
    [roundNumber]="currentRound.number"
    [isWarning]="isWarning"
  />

  <div class="timer-controls">
    @if (isIdle) {
      <button type="button" class="btn btn-primary" (click)="startRound()">
        {{ 'roundScreen.startRound' | l10n }}
      </button>
    }
    @if (isRunning) {
      <button type="button" class="btn btn-secondary" (click)="pauseRound()">
        {{ 'roundScreen.pauseRound' | l10n }}
      </button>
    }
    @if (isPaused) {
      <button type="button" class="btn btn-primary" (click)="resumeRound()">
        {{ 'roundScreen.resumeRound' | l10n }}
      </button>
    }
    <button
      type="button"
      class="btn btn-danger"
      (click)="endRound()"
      [disabled]="state.timerStatus === 'ended'"
    >
      {{ 'roundScreen.endRound' | l10n }}
    </button>
  </div>

  <div class="grid-2" style="margin-top: 1.5rem">
    <app-ladder-board
      [teams]="state.teams"
      [ladder]="state.ladder"
      [roundDiffs]="roundDiffs"
    />
    <app-matchup-list [round]="currentRound" [teams]="state.teams" />
  </div>

  <div style="margin-top: 1rem">
    <app-team-standings [state]="state" />
  </div>

  <div style="margin-top: 1rem">
    <app-round-history
      [rounds]="state.rounds"
      [teams]="state.teams"
      [currentRoundIndex]="state.currentRoundIndex"
    />
  </div>
}
