<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">{{ 'stateEditor.title' | l10n }}</h1>
  </div>

  <div class="editor-wrap">
    <div class="editor-host" #editorHost></div>

    @if (parseError) {
      <div class="parse-error">{{ parseError }}</div>
    }
  </div>

  <div class="history-actions">
    <button type="button" class="btn btn-secondary" [disabled]="!canUndo" (click)="undo()" [title]="'menu.undo' | l10n">&#8630; {{ 'menu.undo' | l10n }}@if (undoType) { ({{ undoType }})}</button>
    <button type="button" class="btn btn-secondary" [disabled]="!canRedo" (click)="redo()" [title]="'menu.redo' | l10n">{{ 'menu.redo' | l10n }}@if (redoType) { ({{ redoType }})} &#8631;</button>
  </div>
  <div class="page-nav">
    <a class="btn btn-secondary" routerLink="/tournament">{{ '< ' + ('breadcrumb.tournament' | l10n) }}</a>
    <button class="btn btn-danger-filled" [disabled]="!isValid" (click)="save()">
      {{ 'stateEditor.save' | l10n }}
    </button>
  </div>
</div>
