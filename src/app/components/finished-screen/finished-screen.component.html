<div class="card champion-card">
  @if (championId) {
    <div class="champion-label">{{ 'finished.championLabel' | l10n }}</div>
    <div class="champion-name">{{ getTeamName(championId) }}</div>
    <p class="champion-note">
      {{ 'finished.championNote' | l10n }}
    </p>
  } @else {
    <div class="champion-label">{{ 'finished.tournamentComplete' | l10n }}</div>
    <div class="champion-name">{{ 'finished.noChampion' | l10n }}</div>
    <p class="champion-note">
      {{ 'finished.noChampionNote' | l10n }}
    </p>
  }
</div>

<div class="grid-2" style="margin-top: 1rem">
  <app-ladder-board [teams]="state.teams" [ladder]="finalLadder" [title]="l10n.get('finished.finalLadder')" />
  <app-team-standings [state]="state" [title]="l10n.get('finished.finalStandings')" />
</div>

<div style="margin-top: 1rem">
  <app-round-history
    [rounds]="state.rounds"
    [teams]="state.teams"
  />
</div>
