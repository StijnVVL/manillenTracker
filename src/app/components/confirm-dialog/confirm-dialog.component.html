@if (isOpen && data) {
  <div class="dialog-overlay">
    <div class="dialog-box">
      <button class="dialog-close" (click)="onCancel()" [title]="l10n.get('common.close')">&#x2715;</button>
      <h2 class="dialog-title">{{ data.title }}</h2>
      <p class="dialog-message">{{ data.message }}</p>
      @if (data.checkboxLabel) {
        <label class="dialog-checkbox">
          <input type="checkbox" [(ngModel)]="checkboxChecked" />
          {{ data.checkboxLabel }}
        </label>
      }
      <div class="dialog-actions">
        <button class="btn btn-secondary" (click)="onCancel()">
          {{ data.cancelText || l10n.get('common.cancel') }}
        </button>
        <button class="btn" [class]="checkboxChecked || !data.checkboxLabel ? (data.confirmClass || 'btn-danger') : 'btn-primary'" (click)="onConfirm()">
          {{ data.checkboxLabel
            ? (checkboxChecked ? (data.confirmText || l10n.get('common.confirm')) : (data.confirmTextUnchecked || data.confirmText || l10n.get('common.confirm')))
            : (data.confirmText || l10n.get('common.confirm')) }}
        </button>
      </div>
    </div>
  </div>
}
