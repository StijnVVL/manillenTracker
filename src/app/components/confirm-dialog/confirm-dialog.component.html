@if (isOpen && data) {
  <div class="dialog-overlay">
    <div class="dialog-box">
      <button class="dialog-close" (click)="onCancel()" [title]="l10n.get('common.close')">&#x2715;</button>
      <h2 class="dialog-title">{{ data.title }}</h2>
      <p class="dialog-message">{{ data.message }}</p>
      <div class="dialog-actions">
        <button class="btn btn-secondary" (click)="onCancel()">
          {{ data.cancelText || l10n.get('common.cancel') }}
        </button>
        <button class="btn btn-danger" (click)="onConfirm()">
          {{ data.confirmText || l10n.get('common.confirm') }}
        </button>
      </div>
    </div>
  </div>
}
