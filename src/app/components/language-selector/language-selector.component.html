<div class="language-selector">
  <div class="dropdown-container" (clickOutside)="closeDropdown()">
    <button
      type="button"
      class="dropdown-trigger"
      (click)="toggleDropdown()"
      [attr.aria-expanded]="isOpen"
    >
      @if (currentLanguageOption) {
        <span class="flag-icon">
          @if (currentLanguage === 'en-GB') {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" width="24" height="12">
              <clipPath id="uk-clip"><rect width="60" height="30"/></clipPath>
              <g clip-path="url(#uk-clip)">
                <rect width="60" height="30" fill="#012169"/>
                <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4" clip-path="url(#uk-diag)"/>
                <clipPath id="uk-diag"><path d="M30,15 L60,30 L60,15 L30,15 L60,0 L30,0 L30,15 L0,0 L0,15 L30,15 L0,30 L30,30 Z"/></clipPath>
                <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
                <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>
              </g>
            </svg>
          }
          @if (currentLanguage === 'nl-BE') {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="24" height="16">
              <rect width="450" height="100" fill="#000"/>
              <rect y="100" width="450" height="100" fill="#FFE936"/>
              <rect y="200" width="450" height="100" fill="#FF0F21"/>
            </svg>
          }
        </span>
        <span class="language-name">{{ currentLanguageOption.nameKey | l10n }}</span>
      }
      <span class="dropdown-arrow" [class.open]="isOpen">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </button>

    @if (isOpen) {
      <div class="dropdown-menu">
        @for (lang of languages; track lang.code) {
          <button
            type="button"
            class="dropdown-item"
            [class.selected]="lang.code === currentLanguage"
            (click)="selectLanguage(lang)"
          >
            <span class="flag-icon">
              @if (lang.code === 'en-GB') {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" width="24" height="12">
                  <clipPath id="uk-clip-item"><rect width="60" height="30"/></clipPath>
                  <g clip-path="url(#uk-clip-item)">
                    <rect width="60" height="30" fill="#012169"/>
                    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/>
                    <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
                    <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>
                  </g>
                </svg>
              }
              @if (lang.code === 'nl-BE') {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="24" height="16">
                  <rect width="450" height="100" fill="#000"/>
                  <rect y="100" width="450" height="100" fill="#FFE936"/>
                  <rect y="200" width="450" height="100" fill="#FF0F21"/>
                </svg>
              }
            </span>
            <span class="language-name">{{ lang.nameKey | l10n }}</span>
            @if (lang.code === currentLanguage) {
              <span class="check-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
            }
          </button>
        }
      </div>
    }
  </div>
</div>
