@if (state.status === 'setup') {
  <app-setup-screen />
}
@if (state.status === 'matchup_display') {
  <app-matchup-display />
}
@if (state.status === 'round') {
  <app-round-screen />
}
@if (state.status === 'scoring') {
  <app-scoring-screen />
}
@if (state.status === 'finished') {
  <app-finished-screen />
}
