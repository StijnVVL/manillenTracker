<div class="rules-container">
  @for (section of sections; track section.titleKey) {
    <div class="rules-section">
      <h2>{{ section.titleKey | l10n }}</h2>
      <p>{{ section.textKey | l10n }}</p>
      <ul class="rules-bullets">
        @for (bullet of section.bulletKeys; track bullet) {
          <li>{{ bullet | l10n }}</li>
        }
      </ul>
    </div>
  }
</div>
